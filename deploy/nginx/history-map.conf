server {
    listen 80;
    server_name history.jonlab.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name history.jonlab.cn;

    ssl_certificate /etc/letsencrypt/live/history.jonlab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/history.jonlab.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index maplibre_3d_history.html;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /maplibre_3d_history.html;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|ico|css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
