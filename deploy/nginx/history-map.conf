server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index maplibre_3d_history.html;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /maplibre_3d_history.html;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|ico|css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
